services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecoconecta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoconecta} -d ${POSTGRES_DB:-ecoconecta}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend: &servicio_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecoconecta}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-ecoconecta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ecoconecta}}
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: ${ALGORITHM:-HS256}
      ENTORNO: ${ENTORNO:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
      SEED_RESET_PASSWORDS: ${SEED_RESET_PASSWORDS:-false}
      WHATSAPP_PROVEEDOR: ${WHATSAPP_PROVEEDOR:-auto}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v25.0}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-es}
      WHATSAPP_TEMPLATE_PROGRAMADA_RECOLECTOR: ${WHATSAPP_TEMPLATE_PROGRAMADA_RECOLECTOR:-}
      WHATSAPP_TEMPLATE_PROGRAMADA_SOLICITANTE: ${WHATSAPP_TEMPLATE_PROGRAMADA_SOLICITANTE:-}
      WHATSAPP_TEMPLATE_RECOLECTADA_RECOLECTOR: ${WHATSAPP_TEMPLATE_RECOLECTADA_RECOLECTOR:-}
      WHATSAPP_TEMPLATE_RECOLECTADA_SOLICITANTE: ${WHATSAPP_TEMPLATE_RECOLECTADA_SOLICITANTE:-}
      WHATSAPP_TEMPLATE_DEFAULT: ${WHATSAPP_TEMPLATE_DEFAULT:-}
      WHATSAPP_TEMPLATE_SIN_VARIABLES: ${WHATSAPP_TEMPLATE_SIN_VARIABLES:-false}
      WHATSAPP_EXIGIR_CONSENTIMIENTO_EXPLICITO: ${WHATSAPP_EXIGIR_CONSENTIMIENTO_EXPLICITO:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_MAX_INTENTOS: ${GEMINI_MAX_INTENTOS:-3}
      GEMINI_BACKOFF_BASE_SEGUNDOS: ${GEMINI_BACKOFF_BASE_SEGUNDOS:-15}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      TWILIO_CONTENT_SID: ${TWILIO_CONTENT_SID:-}
      TWILIO_CONTENT_SIN_VARIABLES: ${TWILIO_CONTENT_SIN_VARIABLES:-false}
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL:-}
      IA_PROVEEDOR: ${IA_PROVEEDOR:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_AUDIO_DEPLOYMENT: ${AZURE_OPENAI_AUDIO_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_API_MODE: ${AZURE_OPENAI_API_MODE:-classic}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  avisos:
    <<: *servicio_backend
    ports: []
    command: python -m app.whatsapp.despacho

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_ENABLE_DEMO_LOGIN: ${VITE_ENABLE_DEMO_LOGIN:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
